# Service-specific override of Fedora's global 10-timeout-abort.conf
# (/usr/lib/systemd/system/service.d/), which sets TimeoutStopFailureMode=abort
# and thus SIGABRTs — and coredumps — every process still in the cgroup if a
# stop hangs. This service can legitimately hold a large cgroup (windows,
# terminals, agents, MCP servers); on a stop timeout, terminate it
# (SIGTERM -> SIGKILL) instead of abort/coredump. A service-specific drop-in in
# /etc outranks the global service.d drop-in; the unit body would not.
[Service]
TimeoutStopFailureMode=terminate
