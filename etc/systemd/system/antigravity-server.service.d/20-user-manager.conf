# Start the user manager BEFORE the launcher captures the session environment
# via `wsl.exe -d fedoraremix --exec env -0`. WSL's CreateLoginSession polls
# `systemctl is-active user@<uid>.service` (up to boot.initTimeout = 10 s) on
# its single Interop thread; with user@1000 already running it returns at once.
# Why it matters: on WSL < 3.0 a client that disconnects mid-wait (a kill-on-
# timeout) crashes the distro init with SIGABRT, after which every new session
# fails with Wsl/Service/E_UNEXPECTED until `wsl --terminate`
# (microsoft/WSL#41592; fixed in 3.0 by PRs #40691/#40433). That is exactly
# what happened at boot on 2026-10-29 (launcher capture hit its 15 s timeout).
# systemd-binfmt: the WSLInterop handler must be registered before wsl.exe runs.
[Unit]
Wants=user@1000.service
After=user@1000.service systemd-binfmt.service
