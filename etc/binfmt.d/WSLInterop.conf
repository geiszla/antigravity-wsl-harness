# DO NOT REMOVE on this distro (verified 2026-07-14, WSL 2.7.10).
# Its PURPOSE is no longer the registration below: WSL 2.7.0+ registers
# WSLInterop itself via a generated second ExecStart in systemd-binfmt.service.
# BUT systemd-binfmt.service is gated by ConditionDirectoryNotEmpty on the
# binfmt.d dirs, and this minimal fedoraremix ships NO other binfmt.d files —
# so this file is the ONLY thing making a binfmt.d dir non-empty. Remove it and
# systemd-binfmt is skipped at boot => WSL never runs its WSLInterop
# registration => no Windows interop (cmd.exe: "cannot execute binary file").
# The line below also serves as a fallback registration if WSL's ExecStart fails.
# Removable only once another binfmt.d file exists (or the distro/WSL changes).
:WSLInterop:M::MZ::/init:P
